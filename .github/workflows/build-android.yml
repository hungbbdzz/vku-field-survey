name: Build Android APK

on:
  push:
    branches: [master]
    paths-ignore:
      - "vku-field-survey.apk"
      - "public/vku-field-survey.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Replace APK in repository
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/vku-field-survey.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk vku-field-survey.apk
          git add -f public/vku-field-survey.apk vku-field-survey.apk package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "build: update Android APK [skip ci]"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vku-field-survey-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

